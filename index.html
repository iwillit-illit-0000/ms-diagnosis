
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガンダムMS診断</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2935;--accent:#67d7ff;--text:#edf5fa;--muted:#aabac6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.65}
main{max-width:760px;margin:auto;padding:24px 16px 60px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.3}
h2{font-size:22px}
.sub,.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid #354957;border-radius:14px;padding:22px;margin:18px 0}
button{font:inherit;cursor:pointer;border-radius:9px;padding:12px 16px;border:1px solid #526a7b;background:#263b4b;color:var(--text)}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent)}
.primary{background:#087ca5;border-color:#40c8f2;font-weight:700}
.answers{display:grid;gap:10px;margin-top:18px}
.answer{text-align:left;padding:15px}
.answer.selected{border:2px solid var(--accent);background:#174258}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:20px}
.progress{height:8px;background:#334553;border-radius:8px;overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .2s}
.stat{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:12px 0}
.bar{height:10px;background:#334553;border-radius:8px;overflow:hidden}
.bar div{height:100%;background:var(--accent)}
.big{font-size:28px;font-weight:800}
.machine-image{display:block;width:100%;max-width:560px;max-height:420px;object-fit:contain;margin:18px auto;border-radius:12px;background:#101820;border:1px solid #354957}
.machine-image[hidden]{display:none}
.gunpla-link{display:inline-block;margin:8px 0 18px;color:var(--accent);font-weight:700}
.badge{display:inline-block;border:1px solid #557080;border-radius:99px;padding:3px 10px;margin:3px;font-size:13px}
.hidden{display:none}
footer{color:var(--muted);font-size:13px;margin-top:30px}
@media(max-width:480px){main{padding:16px 12px}.panel{padding:16px}.stat{grid-template-columns:90px 1fr 30px}}
</style>
</head>
<body>
<main>
<header>
<p class="sub">MOBILE SUIT PERSONALITY ANALYSIS</p>
<h1>ガンダム MS診断</h1>
<p>20問の回答から、あなたの傾向に合うモビルスーツを1機診断します。</p>
</header>

<section id="intro" class="panel">
<h2>診断について</h2>
<ul>
<li>全20問・各4択</li>
<li>結果は候補MSの中から1機だけ選出</li>
</ul>
<p class="muted">機体の能力値は診断用の暫定評価です。公式の性能数値ではありません。</p>
<button class="primary" id="start">診断を始める</button>
</section>

<section id="quiz" class="panel hidden">
<div class="row" style="margin-top:0">
<span id="counter">Q1 / 20</span>
<span id="answered" class="muted">回答済み 0 / 20</span>
</div>
<div class="progress"><div id="progress" style="width:0%"></div></div>
<h2 id="question"></h2>
<p id="hint" class="muted"></p>
<div id="answers" class="answers"></div>
<div class="row">
<button id="back">← 前の質問</button>
<button id="next" class="primary">次の質問 →</button>
</div>
</section>

<section id="result" class="panel hidden" aria-live="polite">
<p class="sub">YOUR MOBILE SUIT</p>
<h2>診断結果</h2>
<div id="machineName" class="big"></div>
<p id="machineId" class="muted"></p>
<img id="machineImage" class="machine-image" alt="" hidden>
<p id="imageNotice" class="muted" hidden></p>
<h3>機体解説</h3>
<p id="description"></p>
<p><a id="gunplaLink" class="gunpla-link" href="#" target="_blank" rel="noopener noreferrer">このMSのガンプラを探す ↗</a></p>
<h3>あなたの戦闘傾向</h3>
<div id="stats"></div>
<p id="reason" class="muted"></p>
<button id="restart" class="primary">もう一度診断する</button>
</section>

<footer>MS診断・試作版 / 機体評価と質問文は今後調整できます。</footer>
</main>

C"}, {"scores": [2, 3, 3, 2, 2, 3], "nt": 0, "group": "A"}, {"scores": [3, 5, 5, 3, 4, 3], "nt": 5, "group": "A"}, {"scores": [3, 4, 2, 4, 5, 3], "nt": 1, "group": "A"}, {"scores": [2, 4, 4, 2, 4, 2], "nt": 0, "group": "A"}, {"scores": [3, 3, 4, 3, 3, 3], "nt": 0, "group": "A"}, {"scores": [5, 2, 3, 4, 3, 2], "nt": 0, "group": "A"}, {"scores": [2, 5, 3, 3, 5, 3], "nt": 3, "group": "A"}, {"scores": [2, 5, 2, 4, 5, 2], "nt": 5, "group": "A"}, {"scores": [5, 2, 3, 3, 3, 2], "nt": 0, "group": "A"}, {"scores": [1, 4, 3, 2, 5, 2], "nt": 0, "group": "A"}, {"scores": [3, 4, 3, 3, 4, 3], "nt": 3, "group": "A"}, {"scores": [5, 3, 4, 3, 3, 3], "nt": 0, "group": "A"}, {"scores": [3, 4, 5, 3, 4, 4], "nt": 0, "group": "A"}, {"scores": [4, 2, 3, 4, 2, 2], "nt": 0, "group": "A"}, {"scores": [3, 4, 4, 3, 3, 3], "nt": 0, "group": "D"}, {"scores": [4, 5, 4, 4, 4, 5], "nt": 4, "group": "D"}, {"scores": [3, 3, 3, 3, 3, 4], "nt": 0, "group": "A"}, {"scores": [3, 4, 4, 3, 4, 3], "nt": 4, "group": "A"}, {"scores": [5, 5, 4, 4, 5, 4], "nt": 4, "group": "A"}, {"scores": [4, 4, 4, 4, 5, 3], "nt": 5, "group": "D"}, {"scores": [5, 4, 4, 4, 5, 3], "nt": 5, "group": "C"}, {"scores": [3, 3, 4, 3, 3, 4], "nt": 0, "group": "B"}, {"scores": [3, 5, 3, 5, 5, 3], "nt": 5, "group": "C"}, {"scores": [3, 3, 3, 3, 3, 4], "nt": 0, "group": "C"}, {"scores": [5, 4, 5, 4, 4, 4], "nt": 1, "group": "C"}, {"scores": [1, 5, 1, 5, 5, 1], "nt": 6, "group": "C"}, {"scores": [4, 4, 5, 4, 4, 4], "nt": 0, "group": "D"}, {"scores": [3, 4, 4, 3, 4, 3], "nt": 2, "group": "B"}];

// 旧0〜10評価を新0〜10評価に変換。低能力機の特徴も残す。
const SCORE_SCALE=[0,1.5,3.3,5.2,7.6,9.6];
// 同じ旧評価でも機体固有の長所・弱点を区別する（順序：近接/射撃/機動/防御/火力/汎用）
const MACHINE_TUNING={
 'RX-78-2':[0,0,0,0,0,0.3], 'RX-75':[-0.2,0,0,0,0,0],
 'MS-07B':[0.4,-0.4,0.1,0,0,-0.2],

};
MACHINES.forEach((m,i)=>{
 const d=WORKBOOK_MACHINES[i];
 const tuning=MACHINE_TUNING[m.id]||[0,0,0,0,0,0];
 m.scores=Object.fromEntries(AXES.map((axis,k)=>[axis,Math.max(0,Math.min(10,SCORE_SCALE[d.scores[k]]+tuning[k]))]));
 m.ntDependence=d.nt;
 m.group=d.group;
});

function calcUser(answers){
 const scores=Object.fromEntries(AXES.map(a=>[a,0]));
 QUESTIONS.forEach((q,i)=>{
  const option=q.options[answers[i]];
  if(option)Object.entries(option.scores).forEach(([a,v])=>scores[a]+=v);
 });
 return scores;
}
function calcNT(answers){
 return QUESTIONS.reduce((sum,q,i)=>sum+(q.options[answers[i]]?.ntPoints||0),0);
}
function canUsePsycommu(nt,m){
 return !(m.ntDependence>=5&&nt<3);
}
// 回答を無作為に選んだ場合の期待値と標準偏差を軸ごとに算出する。
// 従来の「全設問で同じ軸を最大化する」方式は、6軸すべてを低く見積もるため使用しない。
const AXIS_BASELINES=Object.fromEntries(AXES.map(axis=>{
 let mean=0,variance=0;
 for(const q of QUESTIONS){
  if(q.isGroup)continue;
  const values=q.options.map(o=>o.scores[axis]||0);
  const avg=values.reduce((s,v)=>s+v,0)/values.length;
  mean+=avg;
  variance+=values.reduce((s,v)=>s+(v-avg)**2,0)/values.length;
 }
 return [axis,{mean,sd:Math.sqrt(variance)}];
}));
function normalize(scores){
 // 回答の期待値を5点、平均との差1標準偏差を2.1点として0〜10に変換。
 // 軸ごとに質問数が違っても同じ基準で比較できる。
 return Object.fromEntries(AXES.map(axis=>{
  const {mean,sd}=AXIS_BASELINES[axis];
  const value=5+2.1*(scores[axis]-mean)/(sd||1);
  return [axis,Math.max(0,Math.min(10,value))];
 }));
}
function compatibility(user,m){
 // 全体水準だけでなく突出した強み・弱みの形も重視。
 const uMean=AXES.reduce((s,a)=>s+user[a],0)/6;
 const mMean=AXES.reduce((s,a)=>s+m.scores[a],0)/6;
 const absolute=AXES.reduce((s,a)=>s+Math.abs(user[a]-m.scores[a]),0);
 const shape=AXES.reduce((s,a)=>s+Math.abs((user[a]-uMean)-(m.scores[a]-mMean)),0);
 return -(0.60*absolute+0.40*shape);
}
// 各MSが得意とする回答パターンを、能力特性から自動生成する。
// 単なる6軸の合計だけでなく、Q1〜Q20の個別回答にも加点する。
function machinePattern(m,index){
 const favored=[];
 const average=AXES.reduce((t,a)=>t+m.scores[a],0)/6;
 const ntWeight=m.ntDependence>=3?0.55:0;
 for(let qi=0;qi<QUESTIONS.length;qi++){
  const q=QUESTIONS[qi];if(q.isGroup)continue;
  const options=q.options.map((o,oi)=>{
   let fit=AXES.reduce((v,a)=>v+(o.scores[a]||0)*(m.scores[a]-average),0);
   fit+=ntWeight*(o.ntPoints||0);
   // 同じ性能のMSも回答の細部で区別できるよう、少量の個体差を設定。
   const code=Array.from(m.id).reduce((v,c)=>v*31+c.charCodeAt(0),17)>>>0;
   const jitter=((Math.imul(code^(qi*2654435761),1103515245)>>>0) % 997)/997;
   return {oi,fit:fit+0.85*jitter};
  });
  options.sort((a,b)=>b.fit-a.fit||a.oi-b.oi);
  favored.push({q:qi,choice:options[0].oi,weight:Math.max(0.55,Math.min(1.5,(options[0].fit-options[1].fit)*0.3+0.55))});
 }
 // 戦闘希望Q15〜17を必ず含め、行動傾向からも固有の5問を採用。
 const chosen=favored.filter(x=>[14,15,16].includes(x.q));
 const other=favored.filter(x=>x.q<14||x.q>=18);
 other.sort((a,b)=>b.weight-a.weight||((a.q+index*7)%19)-((b.q+index*7)%19));
 return [...chosen,...other.slice(0,7)];
}
// 機体ごとの出現機会を補正。無作為回答で出現しにくい機体を過度に不利にしない。
// 補正は回答に関係なく固定で、同じ回答なら同じ結果となる。
const MACHINE_BALANCE_BONUSES=[0.223,2.885,-0.31,3.625,-2.835,-3.05,3.456,-0.708,5.702,-0.017,-0.073,1.011,3.119,2.091,3.272,0.469,1.122,0.18,1.42,-0.779,-1.313,4.152,1.959,-0.915,-0.027,2.71,0.942,0.507,1.043,2.32,-1.588,-1.855,2.619,-0.976,1.443,-0.844,-0.017,1.846,-0.798,1.252,-0.645,0.087,-0.054,-0.604,3.5359999999999996,1.533,-2.014,0.344,3.31,-2.004,-2.066,1.563,-2.977,0.606,5.116,-0.77,0.654,0.004,1.301,-4.156,3.155,5.259,1.639,2.017];
MACHINES.forEach((m,i)=>{m.pattern=machinePattern(m,i);m.balanceBonus=MACHINE_BALANCE_BONUSES[i]});
function scoreCandidate(answers,user,nt,m){
 const ntAffinity=Math.min(3,Math.max(0,nt-2)*0.09*m.ntDependence);
 const patternPoints=m.pattern.reduce((sum,p)=>sum+(answers[p.q]===p.choice?p.weight:0),0);
 // 同系統の近接機を行動パターンで分離する。
 const specialist=(m.name==='グフ'&&answers[6]===1&&answers[9]===1?3.0:0)
  +(m.name==='ガルスJ'&&answers[6]===0&&answers[9]===0?3.0:0);
 return compatibility(user,m)+ntAffinity+patternPoints*1.15+specialist+m.balanceBonus+(m.popularityBonus||0)*0.7;
}
function diagnose(answers){
 if(answers.length!==QUESTIONS.length||answers.some(a=>!Number.isInteger(a)||a<0||a>3))
  throw Error(`${QUESTIONS.length}問すべてに回答してください。`);
 const scores=calcUser(answers),nt=calcNT(answers),user=normalize(scores);
 const group=QUESTIONS[17].options[answers[17]].group;
 const candidates=MACHINES.filter(m=>m.group===group&&canUsePsycommu(nt,m));
 if(!candidates.length)throw Error("候補機体がありません");
 const machine=[...candidates].sort((a,b)=>scoreCandidate(answers,user,nt,b)-scoreCandidate(answers,user,nt,a)||a.id.localeCompare(b.id))[0];
 return {machine,scores,user,nt,group,candidateCount:candidates.length};
}

const $=id=>document.getElementById(id);
let answers=Array(30).fill(null),current=0;
let questionOrder=[];

// 診断開始ごとに質問の表示順だけをランダム化する。
// 採点用のanswersは元の質問番号で保持する。
function shuffleQuestions(){
 questionOrder=Array.from({length:QUESTIONS.length},(_,i)=>i);
 for(let i=questionOrder.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [questionOrder[i],questionOrder[j]]=[questionOrder[j],questionOrder[i]];
 }
}
function renderQuestion(){
 const qIndex=questionOrder[current];
 const q=QUESTIONS[qIndex];
 $("counter").textContent=`Q${current+1} / ${QUESTIONS.length}`;
 $("answered").textContent=`回答済み ${answers.filter(a=>a!==null).length} / ${QUESTIONS.length}`;
 $("progress").style.width=`${(current+1)/QUESTIONS.length*100}%`;
 $("question").textContent=q.text;
$("hint").textContent="最も自分に近い選択肢を選んでください。";
 $("answers").replaceChildren();
 q.options.forEach((o,i)=>{
  const b=document.createElement("button");
  b.className="answer"+(answers[qIndex]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+"： "+o.label;
  b.setAttribute("aria-pressed",answers[qIndex]===i?"true":"false");
  b.onclick=()=>{answers[qIndex]=i;renderQuestion();};
  $("answers").appendChild(b);
 });
 $("back").disabled=current===0;
 $("next").textContent=current===QUESTIONS.length-1?"診断結果を見る":"次の質問 →";
 $("next").disabled=answers[qIndex]===null;
}
function showResult(){
 try{
  const r=diagnose(answers), m=r.machine;
  $("machineName").textContent=m.name;
  $("machineId").textContent=m.id;
  $("description").textContent=m.description;
  // MS画像を表示する
// MS画像を表示する
const image = $("machineImage");
const imageNotice = $("imageNotice");
const extensions = ["jpg", "jpeg", "png", "webp"];
let imageIndex = 0;

image.hidden = true;
imageNotice.hidden = true;

image.onload = () => {
  image.hidden = false;
  imageNotice.hidden = true;
};

image.onerror = () => {
  imageIndex++;

  if (imageIndex < extensions.length) {
    image.src = `images/${m.id}.${extensions[imageIndex]}`;
  } else {
    image.hidden = true;
    imageNotice.textContent =
      `画像が見つかりません。imagesフォルダに「${m.id}.jpg」などの名前で保存してください。`;
    imageNotice.hidden = false;
  }
};

image.alt = `${m.name}の画像`;
image.src = `images/${m.id}.${extensions[imageIndex]}`;

const gunplaLink = $("gunplaLink");
gunplaLink.href = m.gunplaUrl;
gunplaLink.hidden = false;
const labels=AXES.map(a=>[a,r.user[a]]);
  $("stats").replaceChildren();
  labels.forEach(([axis,value])=>{
   const row=document.createElement("div");row.className="stat";
   const label=document.createElement("span");label.textContent=LABELS[axis];
   const bar=document.createElement("div");bar.className="bar";
   const fill=document.createElement("div");fill.style.width=`${Math.max(0,Math.min(100,value/10*100))}%`;bar.appendChild(fill);
   const number=document.createElement("span");number.textContent=value.toFixed(1);
   row.append(label,bar,number);$("stats").appendChild(row);
  });
   $("reason").textContent=`6つの戦闘傾向を判定。グループ${r.group}の候補${r.candidateCount}機から、能力値と回答パターンの総合相性が最も高い1機を選出しました。`;
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 }catch(e){alert(e.message);}
}
$("start").onclick = () => {
  current = 0;
  answers = Array(QUESTIONS.length).fill(null);
  questionOrder=[...Array.from({length:QUESTIONS.length},(_,i)=>i).filter(i=>i!==17),17];

  $("intro").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  renderQuestion();
};

$("back").onclick = () => {
  if (current > 0) {
    current--;
    renderQuestion();
  }
};

$("next").onclick = () => {
  const qIndex = questionOrder[current];
  if (answers[qIndex] === null) {
    alert("選択肢を選んでください。");
    return;
  }

  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
};

$("restart").onclick = () => {
  answers = Array(QUESTIONS.length).fill(null);
  current = 0;

  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("intro").classList.remove("hidden");
};
